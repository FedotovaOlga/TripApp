<div class="container my-4">

  <div class="row mb-4">
    <div class="col-md-6">
      <input type="text" class="form-control" placeholder="🔍 Rechercher par localisation..." />
    </div>
    <div class="col-md-6">
      <input type="date" class="form-control" />
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let trip of trips">
      <div class="card h-100 shadow-sm">
        <div class="card-img-top bg-success" style="height: 160px;"></div>
        <div class="card-body">
          <h5 class="card-title">{{ trip.title }}</h5>
          <p class="card-text text-muted">📍 {{ trip.locationLabel }}</p>
          <p class="card-text">🗓 {{ trip.startAt | date:'dd/MM/yyyy' }}</p>
          <p class="card-text">👥 {{ trip.capacity }} places</p>
        </div>
        <div class="card-footer">
          <button class="btn btn-success w-100">Voir les détails</button>
        </div>
      </div>
    </div>
  </div>

</div>
